name: ScreenSpan
options:
  bundleIdPrefix: com.screenspan
  deploymentTarget:
    iOS: "17.0"
  swiftVersion: "5.9"

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"

targets:
  ScreenSpan:
    type: application
    platform: iOS
    sources:
      - path: ScreenSpan
        excludes:
          - "*.entitlements"
          - "Views/Components/DonutChartView.swift"
          - "Views/Components/LifeGridView.swift"
      - path: Shared
    info:
      path: ScreenSpan/Info.plist
      uses: [.plist]
      properties:
        UILaunchStoryboardName: LaunchScreen
        UIAppFonts:
          - GeistVF.ttf
          - GeistItalicVF.ttf
          - GeistMonoVF.ttf
          - GeistMonoItalicVF.ttf
    entitlements:
      path: ScreenSpan/ScreenSpan.entitlements
      uses: [.plist]
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.screenspan.shared
    settings:
      DEVELOPMENT_TEAM: 9XXTA2SG5L
      PRODUCT_BUNDLE_IDENTIFIER: com.screenspan
      TARGETED_DEVICE_FAMILY: 1
    dependencies:
      - target: ScreenSpanReport
      - target: ScreenSpanMonitor
      - target: ScreenSpanShield
      - target: ScreenSpanShieldAction
    frameworks:
      - DeviceActivity
      - FamilyControls
      - ManagedSettings
      - StoreKit

  ScreenSpanReport:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: ScreenSpanReport
        excludes:
          - "*.entitlements"
          - "DeviceActivityReport+Contexts.swift"
      - path: Shared
        excludes:
          - "Blocking/**"
      - path: ScreenSpan/Resources/Fonts/Geist
        buildPhase: resources
    info:
      path: ScreenSpanReport/Info.plist
      uses: [.plist]
      properties:
        UIAppFonts:
          - GeistVF.ttf
          - GeistItalicVF.ttf
          - GeistMonoVF.ttf
          - GeistMonoItalicVF.ttf
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    entitlements:
      path: ScreenSpanReport/ScreenSpanReport.entitlements
      uses: [.plist]
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.screenspan.shared
    settings:
      DEVELOPMENT_TEAM: 9XXTA2SG5L
      PRODUCT_BUNDLE_IDENTIFIER: com.screenspan.deviceactivity
      TARGETED_DEVICE_FAMILY: 1
    frameworks:
      - DeviceActivity
      - FamilyControls
      - ManagedSettings

  ScreenSpanMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: ScreenSpanMonitor
        excludes:
          - "*.entitlements"
          - Info.plist
      - path: Shared/Blocking
      - path: Shared/SharedConstants.swift
      - path: Shared/UserDefaults+AppGroup.swift
    info:
      path: ScreenSpanMonitor/Info.plist
      properties:
        CFBundleDisplayName: ScreenSpan Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ScreenSpanMonitorExtension
    entitlements:
      path: ScreenSpanMonitor/ScreenSpanMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.screenspan.shared
    settings:
      DEVELOPMENT_TEAM: 9XXTA2SG5L
      PRODUCT_BUNDLE_IDENTIFIER: com.screenspan.monitor
      TARGETED_DEVICE_FAMILY: 1
    frameworks:
      - DeviceActivity
      - FamilyControls
      - ManagedSettings

  ScreenSpanShield:
    type: app-extension
    platform: iOS
    sources:
      - path: ScreenSpanShield
        excludes:
          - "*.entitlements"
          - Info.plist
      - path: Shared/Blocking
      - path: Shared/SharedConstants.swift
      - path: Shared/UserDefaults+AppGroup.swift
      - path: Shared/TimeIntention.swift
    info:
      path: ScreenSpanShield/Info.plist
      properties:
        CFBundleDisplayName: ScreenSpan Shield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: ScreenSpanShield/ScreenSpanShield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.screenspan.shared
    settings:
      DEVELOPMENT_TEAM: 9XXTA2SG5L
      PRODUCT_BUNDLE_IDENTIFIER: com.screenspan.shield
      TARGETED_DEVICE_FAMILY: 1
    frameworks:
      - DeviceActivity
      - FamilyControls
      - ManagedSettings
      - ManagedSettingsUI

  ScreenSpanShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: ScreenSpanShieldAction
        excludes:
          - "*.entitlements"
          - Info.plist
    info:
      path: ScreenSpanShieldAction/Info.plist
      properties:
        CFBundleDisplayName: ScreenSpan Shield Action
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: ScreenSpanShieldAction/ScreenSpanShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.screenspan.shared
    settings:
      DEVELOPMENT_TEAM: 9XXTA2SG5L
      PRODUCT_BUNDLE_IDENTIFIER: com.screenspan.shieldaction
      TARGETED_DEVICE_FAMILY: 1
    frameworks:
      - ManagedSettings

schemes:
  ScreenSpan:
    build:
      targets:
        ScreenSpan: all
    run:
      config: Debug
      storeKitConfiguration: ScreenSpan.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
